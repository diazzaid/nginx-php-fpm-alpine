[www]

user = nginx
group = nginx

listen = /run/php/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 4
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
;pm.process_idle_timeout = 10s
;pm.max_requests = 500

catch_workers_output = yes
